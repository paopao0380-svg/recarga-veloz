<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3c6e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Recarga Veloz">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

    <title>Pedido Confirmado - Recarga Veloz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container center">
        <div class="success-box">
            <div class="success-icon">✓</div>
            <h1>¡Pedido recibido!</h1>
            <p class="order-number">{{ numero_orden }}</p>
            <p class="instruction-text">Acércate al bar y menciona tu número de orden</p>
            <a href="{{ url_for('index') }}" class="btn-add">Hacer otro pedido</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
