<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3c6e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Recarga Veloz">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

    <title>Pedido Confirmado - Recarga Veloz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/membrete.css') }}">

<style>
        .inst-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px 6px;
            margin-bottom: 6px;
        }
        .inst-crest {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .inst-name {
            font-size: 12px;
            color: #5a6a7a;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
</style>
</head>
<body>
    <div class="container center">

    <div class="membrete">
        <img class="membrete-escudo" src="/static/icons/escudo.png" alt="Escudo institucional" onerror="this.src='/static/icons/escudo.jpg'">
        <div class="membrete-texto">
            <p class="membrete-nombre">UNIDAD EDUCATIVA <span>“DR. JOSÉ MARÍA VELASCO IBARRA”</span></p>
            <p class="membrete-detalle"><strong>AMIE:</strong> 07H00574 · El Guabo – El Oro – Ecuador</p>
            <p class="membrete-detalle">Panamericana sur entre vía Pasaje y Florentino Sáenz de Villaverde</p>
        </div>
        <div class="membrete-sigla">UEJMVI</div>
    </div>

    <div class="success-box">
            <div class="success-icon">✓</div>
            <h1>¡Pedido recibido!</h1>
            <p class="order-number">{{ numero_orden }}</p>
            <p class="instruction-text">Acércate al bar y menciona tu número de orden</p>
            <a href="{{ url_for('index') }}" class="btn-add">Hacer otro pedido</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
