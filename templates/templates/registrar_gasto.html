<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3c6e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Recarga Veloz">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

    <title>Registrar Gasto - Recarga Veloz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/membrete.css') }}">

    <style>
        .form-box { background: white; max-width: 450px; margin: 40px auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .form-box h1 { color: #1a3c6e; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .form-actions { display: flex; gap: 10px; margin-top: 25px; }
        .form-actions button, .form-actions a { flex: 1; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; }
        .btn-save { background: #28a745; color: white; border: none; cursor: pointer; }
        .btn-cancel { background: #6c757d; color: white; }
    
        .inst-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px 6px;
            margin-bottom: 6px;
        }
        .inst-crest {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .inst-name {
            font-size: 12px;
            color: #5a6a7a;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="container">

    <div class="membrete" style="display:flex;align-items:center;gap:12px;padding:8px 14px;margin:0 0 12px 0;background:linear-gradient(180deg,#f5f8fc 0%,#ffffff 100%);border:1px solid #d0dbe8;border-left:4px solid #1a3c6e;border-radius:12px;box-shadow:0 2px 6px rgba(26,60,110,0.07);width:100%;box-sizing:border-box;">
      <img src="{{ url_for('static', filename='icons/escudo.png') }}" alt="Escudo" style="height:78px;width:auto;max-width:64px;object-fit:contain;flex-shrink:0;" onerror="this.onerror=null;this.src='{{ url_for('static', filename='icons/escudo.jpg') }}';">
      <div style="flex:1;min-width:0;line-height:1.2;">
        <div style="font-size:12px;font-weight:700;color:#1a3c6e;letter-spacing:0.8px;">UNIDAD EDUCATIVA</div>
        <div style="font-size:14px;font-weight:800;color:#1a3c6e;margin:0;">DR. JOSÉ MARÍA VELASCO IBARRA</div>
        <div style="font-size:11px;color:#5a6a7a;margin:1px 0 0;">El Guabo – El Oro – Ecuador</div>
        <div style="font-size:11px;color:#5a6a7a;margin:0;"><strong>AMIE:</strong> 07H00574</div>
        <div style="font-size:10px;color:#7a8a9a;margin:0;">Panamericana sur entre vía Pasaje y Florentino Sáenz de Villaverde</div>
      </div>
      <div style="font-size:30px;font-weight:900;color:#1a3c6e;letter-spacing:3px;border-left:2px solid #c5d0e0;padding:6px 2px 6px 14px;flex-shrink:0;line-height:1;">UEJMVI</div>
    </div>






    <div class="form-box">
            <h1>Registrar Gasto</h1>
            <form method="POST">
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" name="descripcion" required placeholder="Ej: Compra de frutas">
                </div>
                <div class="form-group">
                    <label>Monto ($)</label>
                    <input type="number" step="0.01" name="monto" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select name="categoria" required>
                        <option value="Insumos">Insumos / Ingredientes</option>
                        <option value="Empaques">Empaques</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Gasto</button>
                    <a href="{{ url_for('dashboard_contable') }}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
