<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#1a3c6e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Recarga Veloz">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Registrar Gasto - Recarga Veloz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { margin: 0; background: #f0f4f8; min-height: 100vh; }
        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 14px 24px;
        }
        .membrete-barra {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
            border: 1px solid #d0dbe8;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(26, 60, 110, 0.06);
            padding: 8px 14px;
            margin: 0 auto 18px;
            max-width: 920px;
            width: 100%;
            box-sizing: border-box;
        }
        .membrete-barra .escudo {
            width: 52px;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
        }
        .membrete-barra .info {
            flex: 1;
            min-width: 0;
            line-height: 1.15;
        }
        .membrete-barra .info .l1 {
            font-size: 11px;
            font-weight: 700;
            color: #1a3c6e;
            margin: 0;
        }
        .membrete-barra .info .l2 {
            font-size: 13px;
            font-weight: 800;
            color: #1a3c6e;
            margin: 0;
        }
        .membrete-barra .info .l3 {
            font-size: 10px;
            color: #5a6a7a;
            margin: 1px 0 0;
        }
        .membrete-barra .info .l4 {
            font-size: 10px;
            color: #5a6a7a;
            margin: 0;
        }
        .membrete-barra .info .l5 {
            font-size: 9px;
            color: #7a8a9a;
            margin: 0;
        }
        .membrete-barra .sigla-wrap {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            padding-left: 12px;
            border-left: 2px solid #c5d0e0;
        }
        .membrete-barra .sigla {
            font-size: 20px;
            font-weight: 900;
            color: #1a3c6e;
            letter-spacing: 1.5px;
            line-height: 1;
        }
        .form-box {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 24px 26px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .form-box h1 {
            color: #1a3c6e;
            margin: 0 0 18px;
            text-align: center;
            font-size: 22px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .form-actions button,
        .form-actions a {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        @media (max-width: 600px) {
            .membrete-barra .escudo { width: 42px; }
            .membrete-barra .info .l1 { font-size: 10px; }
            .membrete-barra .info .l2 { font-size: 12px; }
            .membrete-barra .sigla { font-size: 15px; }
            .form-box { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <!-- Membrete (mismo estilo que Personal) -->
        <div class="membrete-barra">
            <img class="escudo"
                 src="{{ url_for('static', filename='icons/escudo.png') }}"
                 alt="Escudo"
                 onerror="this.src='{{ url_for('static', filename='icons/escudo.jpg') }}'">
            <div class="info">
                <div class="l1">UNIDAD EDUCATIVA</div>
                <div class="l2">DR. JOSÉ MARÍA VELASCO IBARRA</div>
                <div class="l3">El Guabo – El Oro – Ecuador</div>
                <div class="l4"><strong>AMIE:</strong> 07H00574</div>
                <div class="l5">Panamericana sur entre vía Pasaje y Florentino Sáenz de Villaverde</div>
            </div>
            <div class="sigla-wrap">
                <div class="sigla">UEJMVI</div>
            </div>
        </div>

        <div class="form-box">
            <h1>Registrar Gasto</h1>
            <form method="POST">
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" name="descripcion" required placeholder="Ej: Compra de frutas">
                </div>
                <div class="form-group">
                    <label>Monto ($)</label>
                    <input type="number" step="0.01" name="monto" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select name="categoria" required>
                        <option value="Insumos">Insumos / Ingredientes</option>
                        <option value="Empaques">Empaques</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Gasto</button>
                    <a href="{{ url_for('dashboard_contable') }}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
